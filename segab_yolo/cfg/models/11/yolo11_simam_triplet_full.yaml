# YOLO11n: SimAM backbone + TripletAttention neck (P3+P4)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with SimAM at end
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10
  - [-1, 1, SimAM, []]             # 11 <-- SimAM backbone

# Head with TripletAttention after each top-down fusion
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                    # 13
  - [-1, 1, TripletAttention, []]                # 14 <-- TripletAttention P4->P3
  - [-1, 2, C3k2, [512, False]]                  # 15 (P4-head)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 4], 1, Concat, [1]]                    # 17
  - [-1, 1, TripletAttention, []]                # 18 <-- TripletAttention P3->P4
  - [-1, 2, C3k2, [256, False]]                  # 19 (P3-small output)

  - [-1, 1, Conv, [256, 3, 2]]                   # 20
  - [[-1, 15], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [512, False]]                  # 22 (P4-medium output)

  - [-1, 1, Conv, [512, 3, 2]]                   # 23
  - [[-1, 10], 1, Concat, [1]]                   # 24 (connect to C2PSA backbone)
  - [-1, 2, C3k2, [1024, True]]                  # 25 (P5-large output)

  - [[19, 22, 25], 1, Detect, [nc]]              # Detect(P3, P4, P5)