# YOLO11n: LSKBlock backbone + CoordAtt neck (P3+P4)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with LSKBlock after downsampling Convs
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 1, LSKBlock, []]          # 6 <-- LSKBlock after P4 downsample
  - [-1, 2, C3k2, [512, True]]     # 7
  - [-1, 1, Conv, [1024, 3, 2]]    # 8-P5/32
  - [-1, 1, LSKBlock, []]          # 9 <-- LSKBlock after P5 downsample
  - [-1, 2, C3k2, [1024, True]]    # 10
  - [-1, 1, SPPF, [1024, 5]]       # 11
  - [-1, 2, C2PSA, [1024]]         # 12

# Head with CoordAtt after each top-down fusion
# Backbone has 13 layers (0-12), head starts at 13
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 7], 1, Concat, [1]]                    # 14 (connect to C3k2 P4 at backbone idx 7)
  - [-1, 1, CoordAtt, []]                        # 15 <-- CoordAtt P4->P3
  - [-1, 2, C3k2, [512, False]]                  # 16 (P4-head)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 3], 1, Concat, [1]]                    # 18 (connect to C3k2 P3 at backbone idx 3)
  - [-1, 1, CoordAtt, []]                        # 19 <-- CoordAtt P3->P4
  - [-1, 2, C3k2, [256, False]]                  # 20 (P3-small output)

  - [-1, 1, Conv, [256, 3, 2]]                   # 21
  - [[-1, 16], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [512, False]]                  # 23 (P4-medium output)

  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 12], 1, Concat, [1]]                   # 25 (connect to C2PSA P5 at backbone idx 12)
  - [-1, 2, C3k2, [1024, True]]                  # 26 (P5-large output)

  - [[20, 23, 26], 1, Detect, [nc]]              # Detect(P3, P4, P5)