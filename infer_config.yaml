# Inference benchmark config — models grouped by dataset
common:
  device: null
  warmup: 3
  conf: 0.25
  imgsz: 640
  iou: 0.45

datasets:
  tomatoes:
    source: data/tomatoes/val/images
    model_base: runs/tomatoes
    models:
      - yolo11n
      - yolo11n-gam
      - yolo11n-gam-bbone
      - yolo11n-simam
      - yolo11n-simam-bbone
      - yolo26n

  lettuces:
    source: data/lettuce-omni-ul/val/images
    model_base: runs/lettuces
    models:
      - yolo11n
      - yolo11n-gam
      - yolo11n-gam-bbone
      - yolo11n-simam
      - yolo11n-simam-bbone
      - yolo26n
