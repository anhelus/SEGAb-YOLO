# XAI configuration — models grouped by dataset
methods:
  - eigencam
  - activation

common:
  output_base: reports/xai
  conf_threshold: 0.25
  device: null
  target_location: both

datasets:
  tomatoes:
    source: data/tomatoes/val/images
    model_base: runs/tomatoes
    models:
      - yolo11n
      - yolo11n-gam
      - yolo11n-gam-bbone
      - yolo11n-simam
      - yolo11n-simam-bbone
      - yolo26n

  lettuces:
    source: data/lettuce-omni-ul/val/images
    model_base: runs/lettuces
    models:
      - yolo11n
      - yolo11n-gam
      - yolo11n-gam-bbone
      - yolo11n-simam
      - yolo11n-simam-bbone
      - yolo26n
